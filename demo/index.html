<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVideo storyboard planner</title><style>body{font:16px system-ui;background:#111827;color:#f3f4f6;max-width:760px;margin:40px auto;padding:20px}button,input{font:inherit;padding:8px;margin:4px}button{cursor:pointer}li{padding:12px;border-bottom:1px solid #475569}</style><h1>AIVideo — Storyboard planner</h1><p>Independent timeline demonstration. No AI rendering, network requests or provider charges.</p><form id="form"><label>Scene <input id="name" required maxlength="100"></label><label>Seconds <input id="seconds" type="number" min="1" max="120" step="1" value="8" required></label><button>Add scene</button></form><p id="total">Total: 0 seconds</p><ol id="scenes"></ol><button id="clear">Clear storyboard</button><script>const f=document.querySelector('#form'),n=document.querySelector('#name'),s=document.querySelector('#seconds'),list=document.querySelector('#scenes'),t=document.querySelector('#total');let offset=0;f.onsubmit=e=>{e.preventDefault();const d=Number(s.value);if(!n.value.trim()||!Number.isInteger(d)||d<1||d>120)return;const li=document.createElement('li');li.textContent=offset+'–'+(offset+d)+'s: '+n.value.trim();list.append(li);offset+=d;t.textContent='Total: '+offset+' seconds';n.value='';n.focus()};document.querySelector('#clear').onclick=()=>{offset=0;list.replaceChildren();t.textContent='Total: 0 seconds'};</script></html>
